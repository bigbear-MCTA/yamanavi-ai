<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YamaNavi AI 2.0</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f3f7f4; color: #20382b; }
    header { background: #245c42; color: white; padding: 32px 20px; text-align: center; }
    h1 { margin: 0 0 10px; }
    main { max-width: 700px; margin: 24px auto; padding: 0 16px; }
    section { background: white; padding: 22px; border-radius: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px #00000012; }
    button { background: #245c42; color: white; border: 0; border-radius: 8px; padding: 12px 18px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>⛰️ YamaNavi AI 2.0</h1>
    <p>最高の景色を、最高の思い出に。</p>
  </header>
  <main>
    <section>
      <h2>山を探す</h2>
      <p>天気や希望条件から、おすすめの山を探す機能を作成していきます。</p>
      <button onclick="alert('検索機能は今後追加します')">山を探す</button>
    </section>
    <section>
      <h2>登山計画</h2>
      <p>登山口・駐車場・コース情報を確認できるようにします。</p>
    </section>
    <section>
      <h2>自分の登山履歴</h2>
      <p>GPXファイルの取り込みに対応する予定です。</p>
    </section>
    <section>
      <h2>設定・バックアップ</h2>
      <p>出発地：日立市（初期設定予定）</p>
    </section>
  </main>
</body>
</html>
